[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeprim"
version = "0.1.0"
description = "Shape-primitive object recognition"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "opencv-python-headless",
    "torch",
    "torchvision",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
dev = ["pytest"]
# Phase 3c: SAM-fit extraction loads SlimSAM through transformers
# (extract/sam_fit.py). Not needed for Phases 1-3b or the tests.
real = ["transformers>=4.40", "safetensors"]

[tool.setuptools.packages.find]
where = ["src"]
