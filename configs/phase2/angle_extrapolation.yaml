# Angle extrapolation, the main Phase 2 test (PLAN.md section 6): train on
# viewing angles 0-30 degrees, test on 30-50 and 50-70, and on 10-degree
# bins across the whole range for the accuracy-vs-angle curve.
#
# Both ways of handling viewpoint are run (PLAN.md "key design decision"):
# learned invariance (raw bbox-frame graph) and built-in invariance
# (graph_frame: affine, which whitens each object's second moments and so
# removes shear/squash and, to first order, perspective foreshortening).
# Every graph model is run with the oracle, the classical_v2 and the
# learned extractor, so the representation (oracle) and extraction
# (classical/learned) can be told apart. The learned detector itself was
# trained on 0-30 degrees only (configs/phase2/learned_extractor.yaml).
#
# Validation follows the training distribution (0-30).
phase: phase2
experiment: angle_extrapolation

image_size: 64
n_val_per_class: 40
n_test_per_class: 100
distractor_prob: 0.0
camera_distance: 2.5
seeds: [0, 1, 2]
test_seed: 12345
batch_size: 32
num_workers: 0
device: auto
cache_dir: data/cache
extractor_eval_samples: 200
n_train_per_class: 150
epochs: 40

shift:
  name: view_angle
  train: {view_angle_range: [0, 30]}
  test: {view_angle_range: [50, 70]}
  tests:
    angle_30-50: {view_angle_range: [30, 50]}
    angle_00-10: {view_angle_range: [0, 10]}
    angle_10-20: {view_angle_range: [10, 20]}
    angle_20-30: {view_angle_range: [20, 30]}
    angle_30-40: {view_angle_range: [30, 40]}
    angle_40-50: {view_angle_range: [40, 50]}
    angle_50-60: {view_angle_range: [50, 60]}
    angle_60-70: {view_angle_range: [60, 70]}

models:
  - {name: cnn, kind: cnn, augment: none}
  - {name: cnn_aug, kind: cnn, augment: standard}
  - {name: cnn_aug_view, kind: cnn, augment: view}
  - {name: cnn_probe, kind: cnn, model_config: cnn_probe, augment: none}
  - {name: gnn_oracle, kind: gnn, extractor: oracle}
  - {name: gnn_oracle_affine, kind: gnn, extractor: oracle, graph_frame: affine}
  - {name: gnn_classical, kind: gnn, extractor: classical_v2}
  - {name: gnn_classical_affine, kind: gnn, extractor: classical_v2, graph_frame: affine}
  - {name: gnn_learned, kind: gnn, extractor: learned, extractor_weights: data/models/learned_phase2_0-30.pt}
  - {name: gnn_learned_affine, kind: gnn, extractor: learned, extractor_weights: data/models/learned_phase2_0-30.pt, graph_frame: affine}
  - {name: st_oracle, kind: settransformer, extractor: oracle}
  - {name: bag_oracle, kind: bag, extractor: oracle}
