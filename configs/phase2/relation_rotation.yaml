# Relation test under transforms (PLAN.md section 6): tree vs arrow_sign
# when the drawings are rotated. tree and arrow_sign are exact vertical
# flips of each other, so a 180-degree rotation makes them identical; the
# rotation range is capped at 90 degrees and the limit is documented.
# Train with in-plane rotation up to 30 degrees (plus viewing angle 0-30),
# test on 30-60 and 60-90 degrees of rotation.
phase: phase2
experiment: relation_rotation

image_size: 64
n_val_per_class: 40
n_test_per_class: 100
distractor_prob: 0.0
camera_distance: 2.5
seeds: [0, 1, 2]
test_seed: 12345
batch_size: 32
num_workers: 0
device: auto
cache_dir: data/cache
extractor_eval_samples: 200
n_train_per_class: 150
epochs: 40

view_angle_range: [0, 30]
shift:
  name: rotation
  train: {rotation_range: [0, 30]}
  test: {rotation_range: [60, 90]}
  tests:
    rot_00-30: {rotation_range: [0, 30]}
    rot_30-60: {rotation_range: [30, 60]}
    rot_60-90: {rotation_range: [60, 90]}

models:
  - {name: cnn, kind: cnn, augment: none}
  - {name: cnn_aug_view_rot, kind: cnn, augment: view_rot}
  - {name: gnn_oracle, kind: gnn, extractor: oracle}
  - {name: gnn_oracle_affine, kind: gnn, extractor: oracle, graph_frame: affine}
  - {name: gnn_classical, kind: gnn, extractor: classical_v2}
  - {name: st_oracle, kind: settransformer, extractor: oracle}
  - {name: bag_oracle, kind: bag, extractor: oracle}
