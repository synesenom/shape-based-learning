# GNN pooling ablation on the novel-composition test.
#
# With mean pooling the oracle GNN fell to 0.49 on held-out part variants
# while the set transformer (attention pooling) kept 0.86. Mean pooling
# lets one extra or missing part shift the whole graph summary; max and
# attention pooling should not. Same data, protocol and seeds as
# novel_composition.yaml; only the GNN's readout changes.
#
# Novel compositions (PLAN.md section 5): train on the base template of
# every class, test on held-out variants that add or remove a part (a car
# with three windows, a snowman with a hat, a cat with eyes; see
# objects.NOVEL_VARIANTS). Arrangement-defining structure is kept, so a
# person would still name every variant correctly.
#
# Validation follows the training distribution (base templates only), so
# selection never sees a variant. The in-distribution test set is measured
# on the same seed, so the drop is a paired estimate.
phase: phase1
experiment: novel_composition_pooling

image_size: 64
n_train_per_class: 150
n_val_per_class: 40
n_test_per_class: 100
distractor_prob: 0.0

shift:
  name: novel_composition
  test:
    template_set: novel

seeds: [0, 1, 2]
test_seed: 12345
epochs: 30
batch_size: 32
num_workers: 0
device: auto
cache_dir: data/cache
extractor_eval_samples: 200

models:
  - {name: gnn_oracle, kind: gnn, extractor: oracle}
  - {name: gnn_oracle_max, kind: gnn, extractor: oracle, model_overrides: {pooling: max}}
  - {name: gnn_oracle_attn, kind: gnn, extractor: oracle, model_overrides: {pooling: attention}}
  - {name: gnn_classical, kind: gnn, extractor: classical}
  - {name: gnn_classical_max, kind: gnn, extractor: classical, model_overrides: {pooling: max}}
  - {name: gnn_classical_attn, kind: gnn, extractor: classical, model_overrides: {pooling: attention}}
