# Bag-of-primitives ablation (PLAN.md section 4): per-type count, mean
# size and mean aspect only. No positions, no relations.
hidden_dim: 64
dropout: 0.1
lr: 0.001
weight_decay: 0.0001
optimizer: adam
schedule: cosine
warmup_epochs: 2
min_lr_fraction: 0.01
early_stopping_patience: 8
grad_clip: 5.0
