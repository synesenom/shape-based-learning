# Set transformer over primitives (PLAN.md section 4): the second
# relational architecture. Same training protocol as the GNN and the CNN.
hidden_dim: 64
num_layers: 2
num_heads: 4
dropout: 0.1
lr: 0.001
weight_decay: 0.0001
optimizer: adam
schedule: cosine
warmup_epochs: 2
min_lr_fraction: 0.01
early_stopping_patience: 8
grad_clip: 5.0
